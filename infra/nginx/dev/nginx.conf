# -------------------------------
# 1. 全体設定（マスタープロセス単位）
# -------------------------------
worker_processes auto; # CPUコア数に応じて自動設定

# -------------------------------
# 2. workerプロセス設定
# -------------------------------
events {
    worker_connections 256; # 同時接続数の上限
    use epoll; # Linuxの高速I/O処理方式を使う設定。高負荷サイトではこれが重要らしい。
    multi_accept on; # 一度に複数接続を受け入れる。性能向上のためON推奨。
}

# -------------------------------
# 3. HTTPサーバー設定ブロック
# -------------------------------
http {
    include /etc/nginx/mime.types; # 拡張子に応じてMIMEタイプを設定
    default_type application/octet-stream; # 不明な拡張子はバイナリ扱い

    # パフォーマンス系
    sendfile on; # 静的ファイル（画像、CSS、JSなど）の転送を高速化する。
    tcp_nopush on; # TCPパケットの送信効率を最適化する｡パケット数が減るらしい
    tcp_nodelay on; # 即時送信（Keep-Alive時の遅延防止）
    keepalive_timeout 65; # 1つの接続を開いたまま維持する秒数（65秒）。同じ人が次のリクエストを送るとき再接続せずに高速化できる。

    # 圧縮設定
    # 通信量を減らし、ページ表示を高速化します。
    gzip on;
    gzip_vary on; # キャッシュサーバーやプロキシが、「圧縮を要求するクライアント」と「非圧縮を要求するクライアント」を区別してキャッシュを正しく管理できるようにします。
    gzip_proxied any; # クライアントが直接ではなく、CDNやリバースプロキシなどを経由してアクセスしても gzip 圧縮を適用｡any は「すべてのプロキシ接続に対して有効」という意味です。
    gzip_comp_level 6; # 圧縮レベルを指定 高いとCPU負荷が増える｡（目安：3〜6が現実的）
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype;

    # -------------------------------
    # 仮想ホスト（server）設定
    # -------------------------------
    server {
        listen 80; # ポート番号
        listen [::]:80; # IPv6用ポート
        server_name localhost; # ドメイン名（または _ で全ホスト）

        # -------------------------------
        # セキュリティヘッダ
        # -------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always; # 他サイトが <iframe> でこのページを読み込むのを防止（クリックジャッキング対策）
        add_header X-Content-Type-Options "nosniff" always; # ブラウザが MIME タイプを勝手に推測しないようにする（XSS 対策）

        # コンテンツの文字エンコードを UTF-8 に固定
        charset utf-8;

        # laravel開発サーバーへつなげるプロキシ
        # /api ~ にアクセスしたらlaravel開発サーバーにつなげる
        # vueより先に書かないとvue routerにすべて拾われてしまう
        location /api/ {
            # docker側のポートにつなげる
            proxy_pass http://backend:8000;
            proxy_http_version 1.1; # WebSocketやKeep-Alive対応
            proxy_set_header Host $host; # クライアントのHost情報を保持
            proxy_set_header Upgrade $http_upgrade; # WebSocketのアップグレード要求を転送
            proxy_set_header Connection "upgrade"; # 接続アップグレードを許可
            proxy_set_header X-Real-IP $remote_addr; # 実際のクライアントIP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 多段プロキシ環境での追跡
            proxy_set_header X-Forwarded-Proto $scheme; # リダイレクトやURL生成での判定
        }

        # .htaccess や .env など、ドットで始まるファイルへのアクセスを禁止。
        # ただし、Let’s Encrypt 用の .well-known ディレクトリは例外として許可。
        location ~ /\.(?!well-known).* {
            deny all;
        }

        # ----------------------------
        # Vue開発サーバーへつなげるプロキシ
        # / ~ にアクセスしたらvue開発サーバーにつなげる
        # ----------------------------
        location / {
            proxy_pass http://frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 特殊パス（Viteが内部で使うやつ）を明示的に転送 ---
        # Viteは開発中、モジュールを直接配信するために「/@fs/」「/@vite/」「/src/」などの
        # 仮想パスを使用する。これらは実際のフォルダではなく、Vite内部で処理されるらしい。
        # Nginxがこれらを直接処理すると403になるため、Viteサーバーへプロキシ転送する必要があるらしい。

        # 正規表現でまとめて指定
        location ~ ^/((@vite|@fs|src|node_modules)/) {
            proxy_pass http://frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

    }
}
